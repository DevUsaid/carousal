<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Carousel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="carousel-container">
        <div class="carousel-wrapper">
            <div class="carousel-slide active">
                <img src="https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=900&h=500&fit=crop" alt="Mountain Peak">
                <div class="carousel-slide-title">Mountain Peak</div>
            </div>
            <div class="carousel-slide">
                <img src="https://images.unsplash.com/photo-1544894079-e81a9eb1da8b?w=500&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MjB8fGZyZWUlMjBpbWFnZXN8ZW58MHx8MHx8fDA%3D" alt="Ocean Waves">
                <div class="carousel-slide-title">Ocean Waves</div>
            </div>
            <div class="carousel-slide">
                <img src="https://images.unsplash.com/photo-1519904981063-b0cf448d479e?w=900&h=500&fit=crop" alt="Forest Path">
                <div class="carousel-slide-title">Forest Path</div>
            </div>
            <div class="carousel-slide">
                <img src="https://images.unsplash.com/photo-1505142468610-359e7d316be0?w=900&h=500&fit=crop" alt="Beach Sunset">
                <div class="carousel-slide-title">Beach Sunset</div>
            </div>
            <div class="carousel-slide">
                <img src="https://images.unsplash.com/photo-1518873890627-d4b177c06e51?w=500&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8Nnx8U25vdyUyMGxhbmRzY2FwZXxlbnwwfHwwfHx8MA%3D%3D" alt="Snow Landscape">
                <div class="carousel-slide-title">Snow Landscape</div>
            </div>

            <button class="carousel-button prev" onclick="previousSlide()">❮</button>
            <button class="carousel-button next" onclick="nextSlide()">❯</button>
        </div>

        <div class="carousel-dots" id="dotsContainer"></div>
        <div class="carousel-counter">
            <span id="currentSlide">1</span> of <span id="totalSlides">5</span>
        </div>
    </div>
<!-- //////////////////small updates //////////////// -->
  

    <script src="script.js"></script>
</body>
</html>
